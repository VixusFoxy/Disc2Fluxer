name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: discord-to-fluxer
          - os: windows-latest
            name: windows
            artifact: discord-to-fluxer.exe
          - os: macos-latest
            name: macos
            artifact: discord-to-fluxer

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller==6.19.0
          pip install -r requirements.txt

      - name: Build binary
        run: |
          pyinstaller --onefile --windowed --name discord-to-fluxer discord_to_fluxer/__main__.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" != "windows" ]; then
            mv discord-to-fluxer discord-to-fluxer-${{ matrix.name }}
          else
            mv discord-to-fluxer.exe discord-to-fluxer-windows.exe
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum discord-to-fluxer-* > checksums-${{ matrix.name }}.txt

      - name: Upload to release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2
        with:
          files: |
            dist/discord-to-fluxer-*
            dist/checksums-*.txt
